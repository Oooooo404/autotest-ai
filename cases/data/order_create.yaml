- name: 下单-正常
  request:
    method: POST
    path: /api/order/create
    headers: {token: "${token}"}
    json: {plan_id: "${plan_id}"}
  assert:
    - {type: status, expected: 200}
    - {type: field, path: $.code, op: eq, expected: 0}

- name: 下单-套餐不存在
  request:
    method: POST
    path: /api/order/create
    headers: {token: "${token}"}
    json: {plan_id: 99999}
  assert:
    - {type: status, expected: 200}
    - {type: field, path: $.code, op: eq, expected: 404}
