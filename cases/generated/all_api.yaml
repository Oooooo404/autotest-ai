- name: 注册-正常
  request:
    method: POST
    path: /api/user/register
    json: {username: "${tmp_user}", password: "123456", nickname: "test_user"}
  assert:
    - {type: status, expected: 200}
    - {type: field, path: $.code, op: eq, expected: 0}

- name: 注册-缺少用户名
  request:
    method: POST
    path: /api/user/register
    json: {password: "123456"}
  assert:
    - {type: status, expected: 422}

- name: 注册-缺少密码
  request:
    method: POST
    path: /api/user/register
    json: {username: "${tmp_user}"}
  assert:
    - {type: status, expected: 422}

- name: 注册-用户名为空
  request:
    method: POST
    path: /api/user/register
    json: {username: "", password: "123456"}
  assert:
    - {type: status, expected: 422}

- name: 注册-密码为空
  request:
    method: POST
    path: /api/user/register
    json: {username: "${tmp_user}", password: ""}
  assert:
    - {type: status, expected: 422}

- name: 注册-密码过短
  request:
    method: POST
    path: /api/user/register
    json: {username: "${tmp_user}", password: "123"}
  assert:
    - {type: status, expected: 422}

- name: 注册-密码过长
  request:
    method: POST
    path: /api/user/register
    json: {username: "${tmp_user}", password: "1234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890"}
  assert:
    - {type: status, expected: 422}

- name: 注册-用户名重复
  request:
    method: POST
    path: /api/user/register
    json: {username: "${tmp_user}", password: "123456"}
  assert:
    - {type: status, expected: 200}
    - {type: field, path: $.code, op: neq, expected: 0}

- name: 注册-用户名类型错误
  request:
    method: POST
    path: /api/user/register
    json: {username: 123456, password: "123456"}
  assert:
    - {type: status, expected: 422}

- name: 登录-正常
  request:
    method: POST
    path: /api/user/login
    json: {username: "${tmp_user}", password: "123456"}
  assert:
    - {type: status, expected: 200}
    - {type: field, path: $.code, op: eq, expected: 0}

- name: 登录-密码错误
  request:
    method: POST
    path: /api/user/login
    json: {username: "${tmp_user}", password: "wrongpass"}
  assert:
    - {type: status, expected: 200}
    - {type: field, path: $.code, op: neq, expected: 0}

- name: 登录-用户不存在
  request:
    method: POST
    path: /api/user/login
    json: {username: "nonexist_user", password: "123456"}
  assert:
    - {type: status, expected: 200}
    - {type: field, path: $.code, op: neq, expected: 0}

- name: 登录-用户名为空
  request:
    method: POST
    path: /api/user/login
    json: {username: "", password: "123456"}
  assert:
    - {type: status, expected: 422}

- name: 登录-密码为空
  request:
    method: POST
    path: /api/user/login
    json: {username: "${tmp_user}", password: ""}
  assert:
    - {type: status, expected: 422}

- name: 登录-密码类型错误
  request:
    method: POST
    path: /api/user/login
    json: {username: "${tmp_user}", password: 123456}
  assert:
    - {type: status, expected: 422}

